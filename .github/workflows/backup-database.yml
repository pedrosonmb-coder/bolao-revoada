name: Backup Database

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC = 03:00 BRT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Turso CLI
        run: |
          curl -sSfL https://get.tur.so/install.sh | bash
          echo "$HOME/.turso" >> $GITHUB_PATH

      - name: Verify Turso CLI
        run: turso --version

      - name: Create database dump
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_DATABASE_NAME: ${{ secrets.TURSO_DATABASE_NAME }}
        run: |
          set -e
          DATE=$(date -u +%Y-%m-%d)
          BACKUP_FILE="backup-${DATE}.sql"

          echo "Creating dump for database: $TURSO_DATABASE_NAME"
          turso db shell "$TURSO_DATABASE_NAME" ".dump" > "$BACKUP_FILE"

          if [ ! -s "$BACKUP_FILE" ]; then
            echo "::error::Backup file is empty — dump may have failed"
            exit 1
          fi

          gzip "$BACKUP_FILE"
          echo "BACKUP_FILE=${BACKUP_FILE}.gz" >> $GITHUB_ENV
          echo "BACKUP_DATE=${DATE}" >> $GITHUB_ENV
          ls -lh "${BACKUP_FILE}.gz"

      - name: Create GitHub Release with backup
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backup-${{ env.BACKUP_DATE }}
          name: Backup ${{ env.BACKUP_DATE }}
          body: Backup automático do banco de dados Turso — ${{ env.BACKUP_DATE }}
          files: ${{ env.BACKUP_FILE }}
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup old releases (keep last 30)
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const backupReleases = releases.data
              .filter(r => r.tag_name.startsWith('backup-'))
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const toDelete = backupReleases.slice(30);
            for (const release of toDelete) {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              });
              console.log(`Deleted ${release.tag_name}`);
            }

      - name: Notify on failure
        if: failure()
        run: echo "::error::Backup falhou em $(date -u). Verifique os logs do workflow."
